name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (nim ${{ matrix.nim }}, ${{ matrix.mm }}, threads=${{ matrix.threads }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Official Nim image pinned by version: no third-party actions.
    container: nimlang/nim:${{ matrix.nim }}
    strategy:
      fail-fast: false
      matrix:
        nim: ['2.2.4']
        mm: [orc, arc]
        threads: ['on', 'off']
    steps:
      - uses: actions/checkout@v4

      - name: Allow git in the container workspace (nimble reads the revision)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Tests (release)
        run: nimble test -y --mm:${{ matrix.mm }} --threads:${{ matrix.threads }} -d:release

      - name: Tests (debug, with runtime checks)
        run: nimble test -y --mm:${{ matrix.mm }} --threads:${{ matrix.threads }}

  platforms:
    # macOS and Windows (Q2). No nimlang/nim image there, and no third-party
    # actions: Nim comes from the official downloads at nim-lang.org.
    name: test (${{ matrix.os }}, nim 2.2.4, ${{ matrix.mm }}, threads=${{ matrix.threads }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        mm: [orc, arc]
        threads: ['on', 'off']
    env:
      NIM_VERSION: '2.2.4'
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Nim toolchain
        id: cache-nim
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nim-${{ env.NIM_VERSION }}
          key: nim-${{ env.NIM_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install Nim (macOS, built from the release tarball)
        if: runner.os == 'macOS' && steps.cache-nim.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o nim.tar.xz "https://nim-lang.org/download/nim-$NIM_VERSION.tar.xz"
          tar -xJf nim.tar.xz
          cd "nim-$NIM_VERSION"
          sh build.sh
          bin/nim c --hints:off -d:release koch
          ./koch boot -d:release --hints:off
          ./koch tools --hints:off

      - name: Install Nim (Windows, official binaries)
        if: runner.os == 'Windows' && steps.cache-nim.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://nim-lang.org/download/nim-$env:NIM_VERSION`_x64.zip" -OutFile nim.zip
          Expand-Archive nim.zip -DestinationPath .

      - name: Put Nim on the PATH
        shell: bash
        run: echo "$RUNNER_TEMP/nim-$NIM_VERSION/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        shell: bash
        run: |
          nim --version
          nimble --version
          gcc --version || clang --version

      - name: Tests (release)
        shell: bash
        run: nimble test -y --mm:${{ matrix.mm }} --threads:${{ matrix.threads }} -d:release

      - name: Tests (debug, with runtime checks)
        shell: bash
        run: nimble test -y --mm:${{ matrix.mm }} --threads:${{ matrix.threads }}

  devel:
    # Nim devel is an allowed failure (Q2): it warns early about compiler
    # changes without blocking a merge.
    name: test (nim devel, ${{ matrix.mm }}, allowed to fail)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        mm: [orc, arc]
    steps:
      - uses: actions/checkout@v4

      - name: Build Nim devel
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 https://github.com/nim-lang/Nim.git nim-devel
          cd nim-devel
          sh build_all.sh
          test -x bin/nimble || ./koch tools --hints:off
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: nim --version && nimble --version

      - name: Tests (release)
        run: nimble test -y --mm:${{ matrix.mm }} -d:release

      - name: Tests (debug, with runtime checks)
        run: nimble test -y --mm:${{ matrix.mm }}

  sanitizers:
    # One job per suite: a failure names the suite, and the jobs run in parallel.
    name: sanitizers (${{ matrix.mm }}, ${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mm: [orc, arc]
        suite: [t_prng, t_choices, t_gen, t_shrink, t_engine, t_values, t_stateful, t_find, t_derive, t_database]
    steps:
      - uses: actions/checkout@v4

      - name: Make ASan work with the runner kernel's address randomization
        # With vm.mmap_rnd_bits=32 (ubuntu-latest kernels), the ASan runtime of
        # older compilers, such as the gcc in nimlang/nim:2.2.4, sometimes loops
        # forever printing "AddressSanitizer:DEADLYSIGNAL". It hit the arc job of
        # v0.2 (cancelled after 25 min) and the v0.3 run. Containers share the
        # host kernel, so this is set here and the job runs the image below.
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Build and run under ASan + UBSan + LeakSanitizer (Q6)
        run: |
          docker run --rm -v "$PWD":/w -w /w \
            -e ASAN_OPTIONS=detect_leaks=1 -e UBSAN_OPTIONS=print_stacktrace=1 \
            nimlang/nim:2.2.4 bash -c '
              set -e
              nim c --hints:off --mm:${{ matrix.mm }} -d:useMalloc --debugger:native \
                --passC:-fsanitize=address,undefined --passC:-fno-sanitize-recover=undefined \
                --passC:-fno-omit-frame-pointer --passL:-fsanitize=address,undefined \
                -o:/tmp/suite tests/${{ matrix.suite }}.nim
              # Fails after 5 minutes instead of waiting for the job timeout.
              timeout --verbose --kill-after=30s 300s /tmp/suite'

  quality:
    name: examples, docs, traceability, performance gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: nimlang/nim:2.2.4
    steps:
      - uses: actions/checkout@v4

      - name: Allow git in the container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and run the examples (Q8, DOC1)
        shell: bash
        run: |
          nim c --hints:off -o:/tmp/tour examples/tour.nim
          PROPTEST_DB=off /tmp/tour
          nim c --hints:off -o:/tmp/stateful examples/stateful.nim
          PROPTEST_DB=off /tmp/stateful
          nim c --hints:off -o:/tmp/patterns examples/patterns.nim
          PROPTEST_DB=off /tmp/patterns
          nim c --hints:off -o:/tmp/generators examples/generators.nim
          PROPTEST_DB=off /tmp/generators
          # quickstart has planted bugs: it must report them and fail.
          nim c --hints:off -o:/tmp/quickstart examples/quickstart.nim
          if PROPTEST_DB=off /tmp/quickstart; then
            echo "quickstart was expected to report its planted bugs"; exit 1
          fi

      - name: Generate API documentation (Q4)
        run: nim doc --project --outdir:/tmp/htmldocs src/proptest.nim

      - name: Traceability matrix (ADR-0004)
        run: nimble trace

      - name: Deterministic performance gates (PF7, ADR-0008)
        run: nimble gate
