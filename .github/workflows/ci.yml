name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (nim ${{ matrix.nim }}, ${{ matrix.mm }}, threads=${{ matrix.threads }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Official Nim image pinned by version: no third-party actions.
    container: nimlang/nim:${{ matrix.nim }}
    strategy:
      fail-fast: false
      matrix:
        nim: ['2.2.4']
        mm: [orc, arc]
        threads: ['on', 'off']
    steps:
      - uses: actions/checkout@v4

      - name: Allow git in the container workspace (nimble reads the revision)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Tests (release)
        run: nimble test -y --mm:${{ matrix.mm }} --threads:${{ matrix.threads }} -d:release

      - name: Tests (debug, with runtime checks)
        run: nimble test -y --mm:${{ matrix.mm }} --threads:${{ matrix.threads }}

  sanitizers:
    # One job per suite: a failure names the suite, and the jobs run in parallel.
    name: sanitizers (${{ matrix.mm }}, ${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mm: [orc, arc]
        suite: [t_prng, t_choices, t_gen, t_shrink, t_engine, t_values, t_stateful, t_find]
    steps:
      - uses: actions/checkout@v4

      - name: Make ASan work with the runner kernel's address randomization
        # With vm.mmap_rnd_bits=32 (ubuntu-latest kernels), the ASan runtime of
        # older compilers, such as the gcc in nimlang/nim:2.2.4, sometimes loops
        # forever printing "AddressSanitizer:DEADLYSIGNAL". It hit the arc job of
        # v0.2 (cancelled after 25 min) and the v0.3 run. Containers share the
        # host kernel, so this is set here and the job runs the image below.
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Build and run under ASan + UBSan + LeakSanitizer (Q6)
        run: |
          docker run --rm -v "$PWD":/w -w /w \
            -e ASAN_OPTIONS=detect_leaks=1 -e UBSAN_OPTIONS=print_stacktrace=1 \
            nimlang/nim:2.2.4 bash -c '
              set -e
              nim c --hints:off --mm:${{ matrix.mm }} -d:useMalloc --debugger:native \
                --passC:-fsanitize=address,undefined --passC:-fno-sanitize-recover=undefined \
                --passC:-fno-omit-frame-pointer --passL:-fsanitize=address,undefined \
                -o:/tmp/suite tests/${{ matrix.suite }}.nim
              # Fails after 5 minutes instead of waiting for the job timeout.
              timeout --verbose --kill-after=30s 300s /tmp/suite'

  quality:
    name: examples, docs, traceability, performance gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: nimlang/nim:2.2.4
    steps:
      - uses: actions/checkout@v4

      - name: Allow git in the container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and run the examples (Q8, DOC1)
        shell: bash
        run: |
          nim c --hints:off -o:/tmp/tour examples/tour.nim
          PROPTEST_DB=off /tmp/tour
          nim c --hints:off -o:/tmp/stateful examples/stateful.nim
          PROPTEST_DB=off /tmp/stateful
          nim c --hints:off -o:/tmp/patterns examples/patterns.nim
          PROPTEST_DB=off /tmp/patterns
          # quickstart has planted bugs: it must report them and fail.
          nim c --hints:off -o:/tmp/quickstart examples/quickstart.nim
          if PROPTEST_DB=off /tmp/quickstart; then
            echo "quickstart was expected to report its planted bugs"; exit 1
          fi

      - name: Generate API documentation (Q4)
        run: nim doc --project --outdir:/tmp/htmldocs src/proptest.nim

      - name: Traceability matrix (ADR-0004)
        run: nimble trace

      - name: Deterministic performance gates (PF7, ADR-0008)
        run: nimble gate
